name: 24/7 Live Stream Relay

on:
  schedule:
    - cron: '45 */5 * * *'
  workflow_dispatch:

concurrency:
  group: live-stream-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Detect Font File
        run: |
          FONT_FILE=$(ls HelveticaItalic* 2>/dev/null | head -n 1)
          
          if [ -z "$FONT_FILE" ]; then
            echo "Файл HelveticaItalic не найден, используем фоллбэк"
            FONT_FILE="font.ttf"
          fi
          
          echo "Используется шрифт: $FONT_FILE"
          echo "FONT_FILE=$FONT_FILE" >> $GITHUB_ENV

      - name: Setup Start Time
        run: |
          NOW=$(date +%s)

          if [ ! -f "time.txt" ]; then
            echo "Создаем time.txt с первоначальным временем..."
            echo "$NOW" > time.txt
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add time.txt
            git commit -m "Save initial stream start time [skip ci]"
            git push
          fi

          FIRST_START=$(cat time.txt)
          OFFSET=$((NOW - FIRST_START))

          if [ $OFFSET -lt 0 ]; then
            OFFSET=0
          fi

          echo "OFFSET=$OFFSET" >> $GITHUB_ENV

      - name: Start Stream Relay with Seamless Handover
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Запускаем фоновый таймер: за 60 секунд до конца (через 20640 сек) триггерим следующий раннер,
          # чтобы он успел подняться и встать в готовность до завершения текущего
          (sleep 20640 && curl -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/dispatches \
            -d '{"ref":"main"}') &

          # Запуск идеального чистого потока на 5ч 45мин (20700 сек) без шума
          timeout 20700 ffmpeg -loglevel info -stats_period 5 -re -stream_loop -1 -err_detect ignore_err -i track.mp3 \
            -f lavfi -i color=c=black:s=1280x720:r=30 \
            -filter_complex "[1:v]drawtext=fontfile=${FONT_FILE}:text='%{eif\:t+${OFFSET}\:d}':fontcolor=white:fontsize=84:x=(w-text_w)/2:y=(h-text_h)/2[v]" \
            -map "[v]" -map 0:a \
            -c:v libx264 -preset veryfast -b:v 2500k -minrate 2500k -maxrate 2800k -bufsize 5000k -tune zerolatency -pix_fmt yuv420p -g 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY" || true
            
