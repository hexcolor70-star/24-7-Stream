name: 24/7 Live Stream Relay

on:
  schedule:
    - cron: '45 */5 * * *'
  workflow_dispatch:

# Защита от накладок: одновременно работает ТОЛЬКО один стрим
concurrency:
  group: live-stream-group
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Stream Relay
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          timeout 20700 ffmpeg -re -stream_loop -1 -i music.mp3 -f lavfi -i color=c=black:s=1280x720:r=30 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY" || true

      - name: Trigger Next Workflow Loop
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/dispatches \
            -d '{"ref":"main"}'
