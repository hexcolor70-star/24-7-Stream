name: 24/7 Live Stream Relay

on:
  schedule:
    - cron: '45 */5 * * *'
  workflow_dispatch:

concurrency:
  group: live-stream-group
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & MS Fonts
        run: |
          sudo apt-get update
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y ffmpeg ttf-mscorefonts-installer

      - name: Start Stream Relay
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # Unix Timestamp старта (1 сентября 2026, 00:00:00 UTC)
          # Для текущего теста можно временно поставить TARGET_START=$(date +%s)
          TARGET_START=1788201600
          
          # Текущий timestamp запуска раннера
          NOW=$(date +%s)
          
          # Разница в секундах
          OFFSET=$((NOW - TARGET_START))
          
          timeout 20700 ffmpeg -loglevel info -stats_period 5 -re -stream_loop -1 -err_detect ignore_err -i track.mp3 \
          -f lavfi -i color=c=black:s=1280x720:r=30 \
          -filter_complex "[1:v]noise=alls=20:allf=t+u,drawtext=fontfile=/usr/share/fonts/truetype/msttcorefonts/Times_New_Roman_Italic.ttf:text='%{eif\:pts+${OFFSET}\:d}':fontcolor=white:fontsize=84:x=(w-text_w)/2:y=(h-text_h)/2[v]" \
          -map "[v]" -map 0:a \
          -c:v libx264 -preset ultrafast -b:v 2500k -minrate 2500k -maxrate 2800k -bufsize 5000k -tune zerolatency -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY" || true

      - name: Trigger Next Workflow Loop
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/dispatches \
            -d '{"ref":"main"}'
