name: 24/7 Live Stream Relay

on:
  schedule:
    - cron: '45 */5 * * *'
  workflow_dispatch:

concurrency:
  group: live-stream-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Download Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          
          # Скачиваем файл шрифта Helvetica Neue Bold Italic прямо в рабочую папку
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/helveticanue/HelveticaNeue-BoldItalic.ttf" -o font.ttf || \
          curl -sL "https://github.com/actwu/fonts/raw/master/HelveticaNeue-BoldItalic.ttf" -o font.ttf

      - name: Setup Start Time
        run: |
          NOW=$(date +%s)

          if [ ! -f "time.txt" ]; then
            echo "Создаем time.txt с первоначальным временем..."
            echo "$NOW" > time.txt
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add time.txt
            git commit -m "Save initial stream start time [skip ci]"
            git push
          fi

          FIRST_START=$(cat time.txt)
          OFFSET=$((NOW - FIRST_START))

          if [ $OFFSET -lt 0 ]; then
            OFFSET=0
          fi

          echo "OFFSET=$OFFSET" >> $GITHUB_ENV

      - name: Start Stream Relay
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          timeout 20700 ffmpeg -loglevel info -stats_period 5 -re -stream_loop -1 -err_detect ignore_err -i track.mp3 \
          -f lavfi -i color=c=black:s=1280x720:r=30 \
          -filter_complex "[1:v]noise=alls=20:allf=t+u,drawtext=fontfile=font.ttf:text='%{eif\:t+${OFFSET}\:d}':fontcolor=white:fontsize=84:x=(w-text_w)/2:y=(h-text_h)/2[v]" \
          -map "[v]" -map 0:a \
          -c:v libx264 -preset ultrafast -b:v 2500k -minrate 2500k -maxrate 2800k -bufsize 5000k -tune zerolatency -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY" || true

      - name: Trigger Next Workflow Loop
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/dispatches \
            -d '{"ref":"main"}'
