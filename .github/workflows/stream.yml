name: 24/7 Live Stream Relay

on:
  workflow_dispatch:
  repository_dispatch:
    types: [next_stream]

concurrency:
  group: live-stream-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests

      - name: Detect Font File
        run: |
          FONT_FILE=$(ls HelveticaItalic* 2>/dev/null | head -n 1)
          
          if [ -z "$FONT_FILE" ]; then
            echo "Файл HelveticaItalic не найден, используем фоллбэк"
            FONT_FILE="font.ttf"
          fi
          
          echo "Используется шрифт: $FONT_FILE"
          echo "FONT_FILE=$FONT_FILE" >> $GITHUB_ENV

      - name: Setup Start Time & Formulas
        run: |
          NOW=$(date +%s)

          if [ ! -f "time.txt" ]; then
            echo "Создаем time.txt с первоначальным временем..."
            echo "$NOW" > time.txt
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add time.txt
            git commit -m "Save initial stream start time [skip ci]"
            git push
          fi

          FIRST_START=$(cat time.txt)
          OFFSET=$((NOW - FIRST_START))

          if [ $OFFSET -lt 0 ]; then
            OFFSET=0
          fi

          REMAINING_OFFSET=$((10000001 - OFFSET))
          if [ $REMAINING_OFFSET -lt 0 ]; then
            REMAINING_OFFSET=0
          fi

          echo "OFFSET=$OFFSET" >> $GITHUB_ENV
          echo "REMAINING_OFFSET=$REMAINING_OFFSET" >> $GITHUB_ENV

      - name: Create Python Sub Updater Script
        run: |
          cat << 'EOF' > update_subs.py
          import os
          import time
          import requests

          API_KEY = os.environ.get("YOUTUBE_API_KEY", "")
          CHANNEL_ID = os.environ.get("YOUTUBE_CHANNEL_ID", "")
          GOAL = 100

          SUBS_FILE = "subs.txt"
          ALERT_FILE = "alert.txt"

          def safe_write(filename, text):
              tmp_file = filename + ".tmp"
              with open(tmp_file, "w", encoding="utf-8") as f:
                  f.write(text)
              os.replace(tmp_file, filename)

          safe_write(SUBS_FILE, f"Subscribers: -- / {GOAL}")
          safe_write(ALERT_FILE, "")

          max_sub_count = 0

          def get_sub_count():
              if not API_KEY or not CHANNEL_ID:
                  return None
              url = f"https://www.googleapis.com/youtube/v3/channels?part=statistics&id={CHANNEL_ID}&key={API_KEY}"
              try:
                  res = requests.get(url, timeout=5).json()
                  return int(res["items"][0]["statistics"]["subscriberCount"])
              except Exception as e:
                  print(f"Error: {e}")
                  return None

          while True:
              current_subs = get_sub_count()
              if current_subs is not None:
                  safe_write(SUBS_FILE, f"Subscribers: {current_subs} / {GOAL}")
                  
                  if max_sub_count > 0 and current_subs > max_sub_count:
                      safe_write(ALERT_FILE, "Thanks for Subscribe!")
                      time.sleep(10)
                      safe_write(ALERT_FILE, "")
                  
                  if current_subs > max_sub_count:
                      max_sub_count = current_subs
              time.sleep(15)
          EOF

      - name: Start Stream Relay
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          python update_subs.py &

          # Отправляем триггер за 7 минут (420 сек) до конца работы таймаута
          (sleep 20280 && curl -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"next_stream"}') &

          timeout 20700 ffmpeg -loglevel info -stats_period 5 \
            -re -stream_loop -1 -vn -i track.mp3 \
            -f lavfi -i color=c=black:s=1280x720:r=30 \
            -filter_complex "[1:v]drawtext=fontfile=${FONT_FILE}:text='%{eif\:(n/30)+${OFFSET}\:d}':fontcolor=white:fontsize=100:x=(w-text_w)/2:y=(h-text_h)/2:enable='lte((n/30)+${OFFSET},10000000)',drawtext=fontfile=${FONT_FILE}:text='@uttunbalacu9':fontcolor=white@0.3:fontsize=28:x=30:y=30:enable='lte((n/30)+${OFFSET},10000000)',drawtext=fontfile=${FONT_FILE}:textfile='subs.txt':reload=1:fontcolor=white@0.5:fontsize=22:x=30:y=70:enable='lte((n/30)+${OFFSET},10000000)',drawtext=fontfile=${FONT_FILE}:textfile='alert.txt':reload=1:fontcolor=white:fontsize=32:x=(w-text_w)/2:y=h-80:box=1:boxcolor=black@0.6:boxborderw=10:enable='lte((n/30)+${OFFSET},10000000)',drawtext=fontfile=${FONT_FILE}:text='Time Left\: %{eif\:(${REMAINING_OFFSET}-(n/30))/86400\:d}d %{eif\:mod((${REMAINING_OFFSET}-(n/30))/3600\,24)\:d}h %{eif\:mod((${REMAINING_OFFSET}-(n/30))/60\,60)\:d}m %{eif\:mod(${REMAINING_OFFSET}-(n/30)\,60)\:d}s':fontcolor=gray:fontsize=28:x=w-text_w-30:y=30:enable='lte((n/30)+${OFFSET},10000000)'[v];[0:a]volume=0.35:enable='lte((n/30)+${OFFSET},10000000)',volume=0:enable='gt((n/30)+${OFFSET},10000000)'[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 \
            -preset veryfast \
            -b:v 2500k \
            -maxrate 2500k \
            -bufsize 2500k \
            -pix_fmt yuv420p \
            -g 60 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -reconnect 1 \
            -reconnect_at_eof 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 1 \
            -f flv \
            -flvflags no_duration_filesize \
            "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY tcp_nodelay=1 rw_timeout=2000000" || true
            
