- name: Start Stream Relay with Upper Right Time Left
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          (sleep 20640 && curl -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/dispatches \
            -d '{"ref":"main"}') &

          # Вычисляем оставшиеся дни и секунды для корректного отображения Time Left
          DAYS_LEFT=$((REMAINING_OFFSET / 86400))
          SECS_LEFT=$((REMAINING_OFFSET % 86400))

          timeout 20700 ffmpeg -loglevel info -stats_period 5 -re -stream_loop -1 -err_detect ignore_err -i track.mp3 \
            -f lavfi -i color=c=black:s=1280x720:r=30 \
            -filter_complex "[1:v]\
              drawtext=fontfile=${FONT_FILE}:text='%{eif\:t+${OFFSET}\:d}':fontcolor=white:fontsize=100:x=(w-text_w)/2:y=(h-text_h)/2,\
              drawtext=fontfile=${FONT_FILE}:text='Time Left\: ${DAYS_LEFT}d %{pts\:gmtime\:${SECS_LEFT}-t\:%H\:%M\:%S}':fontcolor=gray:fontsize=30:x=w-text_w-30:y=30[v]" \
            -map "[v]" -map 0:a \
            -c:v libx264 -preset veryfast -b:v 2500k -minrate 2500k -maxrate 2500k -bufsize 2500k -x264-params nal-hrd=cbr -tune zerolatency -pix_fmt yuv420p -g 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY" || true
